[project]
name = "comptroller"
version = "0.1.0"
description = "Budget-aware agent runtime with token tracking, tool execution, and SQLite persistence."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.2.15",
    "langchain-litellm>=0.2.0",
    "langgraph>=1.0.9",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "litellm>=1.82.6",
    "python-dotenv>=1.2.1",
    "rich>=14.3.3",
    "tiktoken>=0.12.0",
    "typer>=0.24.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
comptroller = "comptroller.main:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comptroller = ["prompts/*.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "harness", "SWE-bench"]
